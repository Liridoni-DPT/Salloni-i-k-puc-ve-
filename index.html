<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salloni i Kpucëve - Dyqani Online</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #f9f9f9; }
        h1 { text-align: center; color: #333; margin-bottom: 40px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: #fff; border-radius: 12px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
        .card img { width: 100%; height: 250px; object-fit: cover; border-radius: 8px; }
        .card h3 { font-size: 16px; margin: 15px 0; color: #444; }
        .btn { display: block; background: #25d366; color: #fff; padding: 10px; text-decoration: none; border-radius: 8px; font-weight: bold; }
        .btn:hover { background: #128c7e; }
    </style>
</head>
<body>

    <h1>Salloni i Kpucëve - Koleksioni ynë</h1>

    <div class="grid">
        <!-- Lista e fotove nga folderi juaj images -->
        <script>
            const images = ["11liridoni.jpeg", "1liridoni.jpeg", "Don11.jpeg", "Doni.jpeg", "Doni123.jpeg", "Doni2.jpeg", "Doni3.jpeg", "Donii.jpeg", "Doniii.jpeg", "L11ridoni.jpeg", "L1ri1doni.jpeg", "L1ridioni.jpeg", "L1ridon11.jpeg", "L1ridoni2.jpeg", "LIRIDONI.jpeg", "Li2ridoni.jpeg", "Lidironi11.jpeg", "Liiiridoni.jpeg", "Liiridoni.jpeg", "Liiridini.jpeg", "Lir1doni.jpeg", "Lir1idoni1.jpeg", "Liridoni.jpeg", "Liridoni1.jpeg", "Liridoni11.jpeg"];
            
            images.forEach(img => {
                document.write(`
                    <div class="card">
                        <img src="images/${img}" alt="Produkt">
                        <h3>Model i ri</h3>
                        <a class="btn" href="https://wa.me/38349357723?text=Përshëndetje, dua të porosis produktin: ${img}" target="_blank">Porosit në WhatsApp</a>
                    </div>
                `);
            });
        </script>
    </div>

</body>
</html>
